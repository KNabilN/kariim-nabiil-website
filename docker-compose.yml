services:
  kariim-nabiil-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: kariim-nabiil-website:latest
    container_name: kariim-nabiil-web
    restart: unless-stopped
    networks:
      - n8n_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.kariim-nabiil-web.rule=Host(`kariim-nabiil.com`) || Host(`www.kariim-nabiil.com`)
      - traefik.http.routers.kariim-nabiil-web.entrypoints=websecure
      - traefik.http.routers.kariim-nabiil-web.tls=true
      - traefik.http.routers.kariim-nabiil-web.tls.certresolver=mytlschallenge
      - traefik.http.services.kariim-nabiil-web.loadbalancer.server.port=80

networks:
  n8n_default:
    external: true
